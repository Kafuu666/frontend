<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Audio & Video HTML</title>
</head>

<body>

    <h1>Belajar Audio & Video di HTML</h1>

    <hr>

    <!-- Audio -->
    <h2>1. Audio</h2>

    <audio controls>
        <source src="./image/WhatsApp Ptt 2026-07-23 at 22.17.52.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar audio.
    </audio>

    <hr>

    <!-- Video -->
    <h2>2. Video</h2>

    <video controls width="640" height="360">
        <source src="./image/WhatsApp Video 2026-07-23 at 22.16.32.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutar video.
    </video>

    <hr>

    <!-- YouTube Embed -->
    <h2>3. Video YouTube</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/GMROqOk24aY?si=e_dLIM7IFf7rrs0N"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>

</html>
