<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors & Backgrounds</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        /* Contoh Warna */
        .red {
            color: red;
        }

        .hex {
            color: #ff0000;
        }

        .rgb {
            color: rgb(255, 0, 0);
        }

        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }

        .hsl {
            color: hsl(0, 100%, 50%);
        }

        /* Background */
        .hero {
            width: 100%;
            height: 250px;
            color: white;
            text-align: center;
            line-height: 250px;

            background-color: #1a1a2e;
            background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Gradient */
        .gradient {
            margin-top: 20px;
            padding: 40px;
            color: white;
            text-align: center;
            font-size: 24px;
            background: linear-gradient(135deg, #6C63FF, #FF6584);
        }
    </style>
</head>

<body>

    <h1>Belajar CSS Colors & Backgrounds</h1>

    <h2>Contoh Warna</h2>

    <p class="red">Warna menggunakan nama warna (red).</p>

    <p class="hex">Warna menggunakan kode Hex (#ff0000).</p>

    <p class="rgb">Warna menggunakan RGB (255, 0, 0).</p>

    <p class="rgba">Warna menggunakan RGBA dengan transparansi.</p>

    <p class="hsl">Warna menggunakan HSL.</p>

    <hr>

    <div class="hero">
        Background Image
    </div>

    <div class="gradient">
        Background Gradient
    </div>

</body>

</html>
