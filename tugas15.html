<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Iframe HTML</title>
</head>

<body>

    <h1>Belajar Iframe di HTML</h1>

    <hr>

    <!-- Google Maps -->
    <h2>1. Google Maps</h2>

    <iframe src="https://www.google.com/maps?q=Monas,Jakarta&output=embed" width="600" height="450" loading="lazy"
        allowfullscreen>
    </iframe>

    <hr>

    <!-- Website Lain -->
    <h2>2. Menampilkan Website Lain</h2>

    <iframe src="https://www.wikipedia.org" width="100%" height="500" title="Website Wikipedia">
    </iframe>

</body>

</html>
