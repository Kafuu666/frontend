<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters & Blend Modes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        img {
            width: 250px;
            border-radius: 10px;
            display: block;
            margin: 15px auto;
        }

        /* Blur */
        .blur {
            filter: blur(3px);
        }

        /* Brightness */
        .brightness {
            filter: brightness(1.5);
        }

        /* Contrast */
        .contrast {
            filter: contrast(200%);
        }

        /* Grayscale */
        .grayscale {
            filter: grayscale(100%);
        }

        /* Sepia */
        .sepia {
            filter: sepia(100%);
        }

        /* Hue Rotate */
        .hue {
            filter: hue-rotate(90deg);
        }

        /* Drop Shadow */
        .shadow {
            filter: drop-shadow(5px 5px 10px black);
        }

        /* Multiple Filters */
        .multiple {
            filter: brightness(.8) contrast(1.3);
        }

        /* Blend Mode */
        .blend-container {
            position: relative;
            width: 300px;
            margin: auto;
        }

        .blend-container img {
            width: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 0, 0, .5);
            mix-blend-mode: multiply;
        }
    </style>
</head>

<body>

    <h1>Belajar CSS Filters & Blend Modes</h1>

    <section>

        <h2>1. Filter Blur</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="blur">

    </section>

    <section>

        <h2>2. Brightness</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="brightness">

    </section>

    <section>

        <h2>3. Contrast</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="contrast">

    </section>

    <section>

        <h2>4. Grayscale</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="grayscale">

    </section>

    <section>

        <h2>5. Sepia</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="sepia">

    </section>

    <section>

        <h2>6. Hue Rotate</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="hue">

    </section>

    <section>

        <h2>7. Drop Shadow</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="shadow">

    </section>

    <section>

        <h2>8. Multiple Filters</h2>

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam"
            class="multiple">

    </section>

    <section>

        <h2>9. Blend Mode</h2>

        <div class="blend-container">

            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Pemandangan Alam">

            <div class="overlay"></div>

        </div>

    </section>

</body>

</html>
