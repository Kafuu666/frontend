<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 54 - Conditional Statements</title>
</head>

<body>

    <h1>JavaScript Conditional Statements</h1>

    <button onclick="cekData()">
        Jalankan Program
    </button>

    <div id="hasil"></div>

    <script>

        function cekData() {

            let umur = 18;
            let nilai = 75;
            let hari = "Senin";

            // if...else if...else
            let kategori;

            if (umur >= 18) {
                kategori = "Dewasa";
            } else if (umur >= 13) {
                kategori = "Remaja";
            } else {
                kategori = "Anak-anak";
            }

            // Ternary Operator
            let status = umur >= 18 ? "Dewasa" : "Anak-anak";

            // Switch
            let pesanHari;

            switch (hari) {

                case "Senin":
                    pesanHari = "Awal minggu";
                    break;

                case "Jumat":
                    pesanHari = "TGIF!";
                    break;

                default:
                    pesanHari = "Hari biasa";
            }

            document.getElementById("hasil").innerHTML = `
                <h3>Hasil Percabangan</h3>

                <p><b>Umur:</b> ${umur}</p>
                <p><b>Kategori:</b> ${kategori}</p>

                <p><b>Status (Ternary):</b> ${status}</p>

                <p><b>Hari:</b> ${hari}</p>
                <p><b>Keterangan:</b> ${pesanHari}</p>

                <p><b>Nilai:</b> ${nilai}</p>

                <p>${nilai >= 75
                    ? "Lulus"
                    : "Tidak Lulus"
                }</p>
            `;

            console.log(kategori);
            console.log(status);
            console.log(pesanHari);
        }

    </script>

</body>

</html>
