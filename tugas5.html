<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Gambar HTML</title>
</head>

<body>

    <h1>Belajar Gambar di HTML</h1>

    <h2>1. Gambar Dasar</h2>
    <img src="./image/foto.jpg" alt="Foto Pemandangan">

    <hr>

    <h2>2. Gambar dengan Ukuran</h2>
    <img src="./image/foto.jpg" alt="Pemandangan Alam" width="600" height="400">

    <hr>

    <h2>3. Gambar dari URL</h2>
    <img src="https://picsum.photos/600/400" alt="Gambar Acak dari Internet">

    <hr>

    <h2>4. Gambar sebagai Link</h2>
    <a href="https://www.google.com" target="_blank">
        <img src="https://picsum.photos/150" alt="Klik untuk membuka Google">
    </a>

    <hr>

    <h2>5. Figure dan Figcaption</h2>
    <figure>
        <img src="https://picsum.photos/500/300" alt="Pemandangan Alam">
        <figcaption>Pemandangan alam yang indah.</figcaption>
    </figure>

</body>

</html>
