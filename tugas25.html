<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        /* Reset Box Sizing */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .box {
            width: 300px;
            height: 200px;

            /* Content */
            background-color: #e3f2fd;

            /* Padding */
            padding: 20px;

            /* Border */
            border: 3px solid #2196f3;
            border-radius: 12px;

            /* Margin */
            margin: 20px auto;

            /* Box Sizing */
            box-sizing: border-box;
        }

        .box h2 {
            margin-bottom: 10px;
            color: #0d47a1;
        }

        .box p {
            line-height: 1.6;
        }

        .info {
            width: 300px;
            margin: 20px auto;
            padding: 15px;
            border: 2px dashed gray;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Belajar CSS Box Model</h1>

    <div class="box">
        <h2>Box Model</h2>

        <p>
            Elemen ini memiliki width, height,
            padding, border, margin, dan
            box-sizing.
        </p>
    </div>

    <div class="info">
        <h3>Urutan Box Model</h3>

        <ol>
            <li>Content (Isi)</li>
            <li>Padding (Jarak Dalam)</li>
            <li>Border (Garis Tepi)</li>
            <li>Margin (Jarak Luar)</li>
        </ol>
    </div>

</body>

</html>
