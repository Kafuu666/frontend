<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 49 - Dark Mode</title>

    <style>
        /* ==========================
           LIGHT MODE (DEFAULT)
        ========================== */
        :root {
            --bg: #ffffff;
            --text: #1a1a2e;
            --card-bg: #f4f4f4;
            --primary: #6C63FF;
        }

        /* ==========================
           DARK MODE OTOMATIS
           Mengikuti pengaturan sistem
        ========================== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --text: #e2e8f0;
                --card-bg: #16213e;
            }
        }

        /* ==========================
           DARK MODE MANUAL
        ========================== */
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --text: #e2e8f0;
            --card-bg: #16213e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            max-width: 700px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            transition: .3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .2);
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.8;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: .9;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            opacity: .7;
        }
    </style>
</head>

<body>

    <h1>🌙 CSS Dark Mode</h1>

    <div class="card">

        <h2>Contoh Dark Mode</h2>

        <p>
            Halaman ini menggunakan CSS Variables dan
            <strong>prefers-color-scheme</strong>.
            Klik tombol di bawah untuk mengganti tema secara manual.
        </p>

        <button onclick="toggleTheme()">
            Ganti Tema
        </button>

    </div>

    <footer>
        Hari 49 - CSS Lanjutan
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;

            if (html.getAttribute("data-theme") === "dark") {
                html.removeAttribute("data-theme");
            } else {
                html.setAttribute("data-theme", "dark");
            }
        }
    </script>

</body>

</html>
