<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website belajar HTML dengan menerapkan best practices.">

    <title>Review HTML & Best Practices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Belajar HTML</h1>

        <nav>
            <ul>
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Materi</a></li>
                <li><a href="#">Galeri</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <!-- Main -->
    <main>

        <section>
            <h2>Tentang HTML</h2>

            <p>
                HTML (HyperText Markup Language) adalah bahasa markup
                yang digunakan untuk membuat struktur halaman web.
            </p>

            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
                alt="Seseorang sedang belajar pemrograman di laptop" width="500">
        </section>

        <hr>

        <section>
            <h2>Form Kontak</h2>

            <form action="#" method="post">

                <label for="nama">Nama:</label><br>
                <input type="text" id="nama" name="nama" required minlength="3">
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <button type="submit">Kirim</button>

            </form>
        </section>

    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Belajar HTML. Semua Hak Dilindungi.</p>
    </footer>

</body>

</html>
