<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 62 - DOM Manipulation</title>

    <style>
        .card {
            padding: 10px;
            border: 1px solid black;
            margin-top: 10px;
        }

        .active {
            background-color: yellow;
        }
    </style>

</head>

<body>

    <h1 id="judul">Belajar DOM Manipulation</h1>

    <p id="teks">Halo Dunia</p>

    <a id="link">Kunjungi Website</a>

    <br><br>

    <button onclick="jalankanDOM()">
        Jalankan Program
    </button>

    <div id="hasil"></div>

    <script>

        function jalankanDOM() {

            const el = document.getElementById("teks");

            // Mengubah konten
            el.textContent = "Teks baru";
            el.innerHTML = "<strong>HTML baru</strong>";

            // Mengubah atribut
            const link = document.getElementById("link");

            link.setAttribute("href", "https://baru.com");
            link.setAttribute("target", "_blank");

            const href = link.getAttribute("href");

            // Mengubah style
            el.style.color = "red";
            el.style.fontSize = "20px";
            el.style.backgroundColor = "#f0f0f0";

            // Class manipulation
            el.classList.add("active");

            const aktif = el.classList.contains("active");

            // Membuat elemen baru
            const newDiv = document.createElement("div");

            newDiv.className = "card";

            newDiv.textContent = "Card baru";

            document.body.appendChild(newDiv);

            document.getElementById("hasil").innerHTML = `
        <h3>Hasil Manipulasi DOM</h3>

        <p>Link : ${href}</p>

        <p>Class active : ${aktif}</p>
    `;

            console.log(href);
            console.log(aktif);

        }

    </script>

</body>

</html>
