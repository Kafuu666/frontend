<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 44 - Advanced Animations</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            padding: 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 15px;
            color: #444;
        }

        section {
            text-align: center;
        }

        /* =========================
           FLOAT ANIMATION
        ========================= */

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .float-box {
            width: 120px;
            height: 120px;
            background: #6C63FF;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            animation: float 2s ease-in-out infinite;
        }

        /* =========================
           SPIN ANIMATION
        ========================= */

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ddd;
            border-top: 6px solid #6C63FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        /* =========================
           TYPING EFFECT
        ========================= */

        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        .typing {
            width: 30ch;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid black;
            font-size: 24px;
            animation:
                typing 3s steps(30) forwards,
                blink .7s infinite;
        }
    </style>
</head>

<body>

    <h1>CSS Advanced Animations</h1>

    <section>
        <h2>1. Float Animation</h2>

        <div class="float-box">
            Floating
        </div>
    </section>

    <section>
        <h2>2. Loading Spinner</h2>

        <div class="spinner"></div>
    </section>

    <section>
        <h2>3. Typing Effect</h2>

        <div class="typing">
            Selamat Belajar CSS Animation!
        </div>
    </section>

</body>

</html>
