<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari 58 - Objects</title>
</head>

<body>

    <h1>JavaScript Objects</h1>

    <button onclick="jalankanObject()">
        Jalankan Program
    </button>

    <div id="hasil"></div>

    <script>

        function jalankanObject() {

            const user = {
                nama: "Andi",
                umur: 25,
                email: "andi@email.com",

                alamat: {
                    kota: "Jakarta",
                    kodePos: "12345"
                },

                hobby: ["Coding", "Gaming"],

                sapa() {
                    return `Halo, saya ${this.nama}`;
                }
            };

            const { nama, umur, email } = user;

            const keys = Object.keys(user);
            const values = Object.values(user);
            const entries = Object.entries(user);

            const newUser = {
                ...user,
                role: "Developer"
            };

            document.getElementById("hasil").innerHTML = `
        <h3>Data User</h3>

        <p><b>Nama:</b> ${user.nama}</p>
        <p><b>Email:</b> ${user["email"]}</p>
        <p><b>Kota:</b> ${user.alamat.kota}</p>
        <p><b>Hobby:</b> ${user.hobby.join(", ")}</p>
        <p><b>Method:</b> ${user.sapa()}</p>

        <hr>

        <h3>Destructuring</h3>

        <p>${nama}</p>
        <p>${umur}</p>
        <p>${email}</p>

        <hr>

        <h3>Object Methods</h3>

        <p>Keys: ${keys.join(", ")}</p>
        <p>Values: ${values.join(", ")}</p>
        <p>Entries: ${JSON.stringify(entries)}</p>

        <hr>

        <h3>Spread Operator</h3>

        <p>Role: ${newUser.role}</p>
    `;

            console.log(user);
            console.log(keys);
            console.log(values);
            console.log(entries);
            console.log(newUser);

        }

    </script>

</body>

</html>
