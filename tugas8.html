<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Form HTML</title>
</head>

<body>

    <h1>Form Pendaftaran</h1>

    <form action="/submit" method="POST">

        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="umur">Umur:</label><br>
        <input type="number" id="umur" name="umur"><br><br>

        <label for="telepon">No. Telepon:</label><br>
        <input type="tel" id="telepon" name="telepon"><br><br>

        <label for="website">Website:</label><br>
        <input type="url" id="website" name="website"><br><br>

        <label for="tanggal">Tanggal Lahir:</label><br>
        <input type="date" id="tanggal" name="tanggal"><br><br>

        <label for="jam">Jam:</label><br>
        <input type="time" id="jam" name="jam"><br><br>

        <label for="warna">Warna Favorit:</label><br>
        <input type="color" id="warna" name="warna"><br><br>

        <label for="nilai">Nilai (0-100):</label><br>
        <input type="range" id="nilai" name="nilai" min="0" max="100"><br><br>

        <label for="foto">Upload Foto:</label><br>
        <input type="file" id="foto" name="foto"><br><br>

        <p>Jenis Kelamin:</p>
        <input type="radio" id="laki" name="jk" value="Laki-laki">
        <label for="laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jk" value="Perempuan">
        <label for="perempuan">Perempuan</label>

        <br><br>

        <input type="checkbox" id="setuju" name="setuju">
        <label for="setuju">Saya menyetujui syarat dan ketentuan</label>

        <br><br>

        <button type="submit">Kirim</button>

    </form>

</body>

</html>
