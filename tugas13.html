<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Div & Span</title>
</head>

<body>

    <h1>Belajar Div & Span</h1>

    <hr>

    <!-- Contoh Div -->
    <div class="card">
        <h2>Laptop Gaming</h2>
        <p>
            Laptop ini memiliki prosesor Intel Core i7,
            RAM 16GB, dan SSD 512GB.
        </p>
    </div>

    <hr>

    <!-- Contoh Span -->
    <p>
        Harga:
        <span class="price">Rp 12.500.000</span>
    </p>

    <hr>

    <!-- Contoh Layout -->
    <div class="container">

        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Beranda</li>
                <li>Produk</li>
                <li>Tentang</li>
                <li>Kontak</li>
            </ul>
        </div>

        <div class="content">
            <h2>Selamat Datang</h2>
            <p>
                Ini adalah area konten utama website.
                Semua informasi utama ditampilkan di bagian ini.
            </p>
        </div>

    </div>

</body>

</html>
